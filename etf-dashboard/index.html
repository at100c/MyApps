<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>ETF 趋势仪表盘 · 网页版</title>
    <style>
      :root {
        --bg: #F7F4EE;
        --ink: #2E2A24;
        --ink-soft: #5C554A;
        --ink-faint: #8A8172;
        --brick: #9C2F1F;
        --up: #1E7A3C;
        --down: #B3372A;
        --shadow-dark: rgba(168, 152, 128, 0.45);
        --shadow-light: rgba(255, 255, 255, 0.95);
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.45;
      }
      .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 56px; }

      /* ---------- 页眉 ---------- */
      header.page-head { margin-bottom: 30px; }
      h1 {
        font-size: 30px; font-weight: 800; letter-spacing: 0.5px;
        margin: 0 0 6px;
      }
      .snapshot-line { color: var(--ink-soft); font-size: 14px; margin: 0 0 18px; }
      .snapshot-line strong { color: var(--brick); font-weight: 700; }
      .status-row { display: flex; flex-wrap: wrap; gap: 14px; }
      .status-chip {
        background: var(--bg);
        border-radius: 14px;
        padding: 12px 18px;
        box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
        font-size: 14px; color: var(--ink-soft);
        display: flex; align-items: baseline; gap: 8px;
      }
      .status-chip b { font-size: 17px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
      .status-chip b.neg { color: var(--down); }
      .status-chip b.pos { color: var(--up); }

      /* ---------- 区块标题 ---------- */
      h2.section-title {
        font-size: 21px; font-weight: 800; margin: 38px 0 4px;
        display: flex; align-items: center; gap: 10px;
      }
      h2.section-title::before {
        content: ""; width: 9px; height: 22px; border-radius: 5px;
        background: var(--brick); display: inline-block; flex: none;
      }
      .section-note { color: var(--ink-faint); font-size: 13px; margin: 0 0 18px 19px; }
      h3.group-title {
        font-size: 16px; font-weight: 700; color: var(--ink-soft);
        margin: 24px 0 12px; letter-spacing: 1px;
      }
      h3.group-title:first-of-type { margin-top: 6px; }

      /* ---------- ETF 面板 ---------- */
      .panel-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
        gap: 18px;
      }
      .etf-panel {
        background: var(--bg);
        border-radius: 20px;
        padding: 18px 18px 14px;
        box-shadow: 7px 7px 14px var(--shadow-dark), -7px -7px 14px var(--shadow-light),
                    inset 1px 1px 0 rgba(255,255,255,0.85);
      }
      .panel-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .symbol { font-size: 23px; font-weight: 800; letter-spacing: 0.4px; }
      .category { font-size: 12.5px; color: var(--ink-faint); text-align: right; }
      .price-row { display: flex; align-items: baseline; gap: 12px; margin: 8px 0 12px; }
      .close { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .day-change { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .day-change.up { color: var(--up); }
      .day-change.down { color: var(--down); }
      .day-change.flat { color: var(--ink-faint); }
      .metrics {
        display: grid; grid-template-columns: 1fr 1fr; gap: 7px 14px;
        border-top: 1px solid rgba(168, 152, 128, 0.35);
        padding-top: 11px;
      }
      .metric { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; font-size: 13px; }
      .metric .m-label { color: var(--ink-faint); white-space: nowrap; }
      .metric .m-value { font-weight: 600; font-size: 14.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .metric .m-value.neg { color: var(--down); }
      .metric .m-value.na { color: var(--ink-faint); font-weight: 400; }

      /* ---------- 热力图 ---------- */
      .treemap-box {
        background: var(--bg);
        border-radius: 20px;
        padding: 14px;
        box-shadow: inset 4px 4px 9px var(--shadow-dark), inset -4px -4px 9px var(--shadow-light);
      }
      .treemap { position: relative; width: 100%; }
      .tm-cell {
        position: absolute;
        border-radius: 8px;
        overflow: hidden;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        text-align: center;
        padding: 3px;
        border: 1px solid rgba(255,255,255,0.55);
      }
      .tm-sym { font-weight: 800; line-height: 1.15; letter-spacing: 0.3px; }
      .tm-chg { font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
      .tm-note { line-height: 1.25; opacity: 0.85; }
      .legend {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        font-size: 12.5px; color: var(--ink-faint); margin: 12px 2px 0;
      }
      .legend .swatch { width: 46px; height: 12px; border-radius: 6px; flex: none;
        background: linear-gradient(90deg, #B3372A, #EFE9DD 50%, #1E7A3C); }

      footer.page-foot {
        margin-top: 44px; font-size: 12.5px; color: var(--ink-faint);
        border-top: 1px solid rgba(168,152,128,0.35); padding-top: 14px;
      }

      @media (max-width: 560px) {
        .wrap { padding: 20px 14px 44px; }
        h1 { font-size: 25px; }
        .panel-grid { grid-template-columns: 1fr 1fr; gap: 13px; }
        .etf-panel { padding: 14px 13px 11px; border-radius: 16px; }
        .symbol { font-size: 19px; }
        .close { font-size: 17px; }
        .metrics { grid-template-columns: 1fr; gap: 6px; }
        .metric { flex-direction: row; justify-content: space-between; align-items: baseline; }
      }
      @media (max-width: 380px) {
        .panel-grid { grid-template-columns: 1fr; }
        .metrics { grid-template-columns: 1fr 1fr; }
      }
    </style>
  </head>
  <body>

          {symbol:"XRE",section:"RRSP",weight:null,close:15.68,day_change:1.1613,note:"观察 · 无目标金额"}
        ]
      };

      // ===== 格式化 =====
      function fmtPct(v, digits) {
        if (v === null || v === undefined || isNaN(v)) return "—";
        var d = (digits === undefined) ? 2 : digits;
        var s = Math.abs(v).toFixed(d);
        return (v > 0 ? "+" : (v < 0 ? "−" : "")) + s + "%";
      }
      function fmtMoney(v) { return "$" + v.toFixed(2); }
      function chgClass(v) { return v > 0 ? "up" : (v < 0 ? "down" : "flat"); }

      // ===== 页眉状态 =====
      (function () {
        var ndx = document.getElementById("ndx-dist");
        ndx.textContent = fmtPct(DATA.ndx_dist_200);
        ndx.className = DATA.ndx_dist_200 < 0 ? "neg" : "pos";
        var lev = document.getElementById("lev-band");
        lev.textContent = DATA.lev_band_state === "out" ? "带外 · 未部署" : DATA.lev_band_state;
      })();

      // ===== 每日数据面板 =====
      function panelHTML(e) {
        var val = (e.valuation === null || e.valuation === undefined)
          ? '<span class="m-value na">—</span>'
          : '<span class="m-value">' + e.valuation.toFixed(1) + '</span>';
        function dist(label, v) {
          return '<div class="metric"><span class="m-label">' + label + '</span>' +
                 '<span class="m-value' + (v < 0 ? ' neg' : '') + '">' + fmtPct(v) + '</span></div>';
        }
        return '<article class="etf-panel">' +
          '<div class="panel-top"><span class="symbol">' + e.symbol + '</span>' +
          '<span class="category">' + e.category + '</span></div>' +
          '<div class="price-row"><span class="close">' + fmtMoney(e.close) + '</span>' +
          '<span class="day-change ' + chgClass(e.day_change) + '">' + fmtPct(e.day_change) + '</span></div>' +
          '<div class="metrics">' +
            dist("距 21 日线", e.dist_21) +
            dist("距 50 日线", e.dist_50) +
            dist("距 200 日线", e.dist_200) +
            '<div class="metric"><span class="m-label">估值分位</span>' + val + '</div>' +
          '</div></article>';
      }
      (function () {
        var groups = [
          { title: "TFSA", items: DATA.etfs.filter(function (e) { return e.account === "TFSA"; }) },
          { title: "RRSP", items: DATA.etfs.filter(function (e) { return e.account === "RRSP"; }) },
          { title: "美元 RRSP", items: DATA.usd_etfs }
        ];
        var html = "";
        groups.forEach(function (g) {
          html += '<h3 class="group-title">' + g.title + '</h3><div class="panel-grid">' +
                  g.items.map(panelHTML).join("") + '</div>';
        });
        document.getElementById("daily-groups").innerHTML = html;
      })();

      // ===== 热力图（squarified treemap）=====
      function mixColor(t) {
        // t ∈ [-1, 1]，0 为底色；正绿负红
        var base = [239, 233, 221];
        var target = t >= 0 ? [30, 122, 60] : [179, 55, 42];
        var k = Math.pow(Math.abs(t), 0.75);
        var r = Math.round(base[0] + (target[0] - base[0]) * k);
        var g = Math.round(base[1] + (target[1] - base[1]) * k);
        var b = Math.round(base[2] + (target[2] - base[2]) * k);
        return { bg: "rgb(" + r + "," + g + "," + b + ")", strong: Math.abs(t) > 0.45 };
      }
      function worst(row, side) {
        var s = 0, mx = -Infinity, mn = Infinity, i, v;
        for (i = 0; i < row.length; i++) { v = row[i].area; s += v; if (v > mx) mx = v; if (v < mn) mn = v; }
        return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn));
      }
      function layoutRow(row, rect, out) {
        var s = 0, i;
        for (i = 0; i < row.length; i++) s += row[i].area;
        if (rect.w >= rect.h) {
          var colW = s / rect.h, y = rect.y;
          for (i = 0; i < row.length; i++) {
            var hh = row[i].area / colW;
            out.push({ item: row[i].item, x: rect.x, y: y, w: colW, h: hh });
            y += hh;
          }
          return { x: rect.x + colW, y: rect.y, w: rect.w - colW, h: rect.h };
        } else {
          var rowH = s / rect.w, x = rect.x;
          for (i = 0; i < row.length; i++) {
            var ww = row[i].area / rowH;
            out.push({ item: row[i].item, x: x, y: rect.y, w: ww, h: rowH });
            x += ww;
          }
          return { x: rect.x, y: rect.y + rowH, w: rect.w, h: rect.h - rowH };
        }
      }
      function squarify(items, rect) {
        var out = [], row = [], r = { x: rect.x, y: rect.y, w: rect.w, h: rect.h }, i;
        for (i = 0; i < items.length; i++) {
          var side = Math.min(r.w, r.h);
          if (row.length === 0 || worst(row, side) >= worst(row.concat([items[i]]), side)) {
            row.push(items[i]);
          } else {
            r = layoutRow(row, r, out);
            row = [items[i]];
          }
        }
        if (row.length) layoutRow(row, r, out);
        return out;
      }
      function renderTreemap(container, items, height) {
        var W = container.clientWidth;
        if (!W) return;
        container.style.height = height + "px";
        container.innerHTML = "";
        var minWeight = Infinity, total = 0, i, it;
        for (i = 0; i < items.length; i++) {
          if (items[i].weight !== null && items[i].weight < minWeight) minWeight = items[i].weight;
        }
        var nodes = items.map(function (d) {
          // weight 只决定面积比例（源数据已归一化，不含金额）；无权重者给最小块
          var wgt = (d.weight === null) ? minWeight * 0.55 : d.weight;
          total += wgt;
          return { item: d, area: wgt };
        });
        var scale = (W * height) / total;
        nodes.forEach(function (n) { n.area *= scale; });
        var rects = squarify(nodes, { x: 0, y: 0, w: W, h: height });
        var GAP = 3;
        rects.forEach(function (rc) {
          var d = rc.item;
          var t = Math.max(-1, Math.min(1, d.day_change / 3));
          var c = mixColor(t);
          var cell = document.createElement("div");
          cell.className = "tm-cell";
          cell.style.left = (rc.x + GAP / 2) + "px";
          cell.style.top = (rc.y + GAP / 2) + "px";
          cell.style.width = Math.max(0, rc.w - GAP) + "px";
          cell.style.height = Math.max(0, rc.h - GAP) + "px";
          cell.style.background = c.bg;
          cell.style.color = c.strong ? "#FFFDF7" : "#2E2A24";
          var minDim = Math.min(rc.w, rc.h);
          var symSize = Math.max(10, Math.min(19, minDim * 0.30));
          var chgSize = Math.max(9, Math.min(14.5, minDim * 0.22));
          var inner = '<div class="tm-sym" style="font-size:' + symSize + 'px">' + d.symbol + '</div>' +
                      '<div class="tm-chg" style="font-size:' + chgSize + 'px">' + fmtPct(d.day_change) + '</div>';
          if (d.note && rc.w > 74 && rc.h > 52) {
            inner += '<div class="tm-note" style="font-size:10.5px">' + d.note + '</div>';
          }
          cell.innerHTML = inner;
          container.appendChild(cell);
        });
      }
      var heatSections = [];
      (function () {
        var host = document.getElementById("heatmap-groups");
        ["TFSA", "RRSP"].forEach(function (sec) {
          var title = document.createElement("h3");
          title.className = "group-title";
          title.textContent = sec;
          var box = document.createElement("div");
          box.className = "treemap-box";
          var tm = document.createElement("div");
          tm.className = "treemap";
          box.appendChild(tm);
          host.appendChild(title);
          host.appendChild(box);
          heatSections.push({
            el: tm,
            items: DATA.heatmap.filter(function (d) { return d.section === sec; })
          });
        });
      })();
      function drawHeatmaps() {
        var mobile = window.innerWidth <= 560;
        heatSections.forEach(function (s) {
          renderTreemap(s.el, s.items, mobile ? 300 : 330);
        });
      }
      var resizeTimer = null;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(drawHeatmaps, 120);
      });
      drawHeatmaps();
    </script>
  </body>
</html>
