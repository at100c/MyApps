<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>加拿大ETF每周扫描 · 网页版</title>
    <style>
      :root {
        --bg: #F7F4EE;
        --ink: #2E2A24;
        --ink-soft: #5C564C;
        --ink-faint: #8A8378;
        --accent: #9C2F1F;
        --shadow-dark: #D9D2C3;
        --shadow-light: #FFFFFF;
        --chip-bg: #EFEAE0;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        line-height: 1.65;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 28px 18px 40px;
      }

      /* ---------- 页眉 ---------- */
      header { margin-bottom: 22px; }
      .title-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px 14px;
      }
      h1 {
        font-size: 26px;
        line-height: 1.3;
        margin: 0;
        font-weight: 800;
        letter-spacing: 0.01em;
      }
      .snapshot-badge {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
        background: var(--bg);
        border-radius: 999px;
        padding: 4px 12px;
        box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        white-space: nowrap;
      }
      .week-line {
        margin: 8px 0 0;
        font-size: 15px;
        color: var(--ink-soft);
      }
      .week-line strong { color: var(--ink); font-weight: 700; }

      /* ---------- 新拟物卡片 ---------- */
      .card {
        background: var(--bg);
        border-radius: 20px;
        box-shadow: 7px 7px 16px var(--shadow-dark), -7px -7px 16px var(--shadow-light),
          inset 0 0 0 1px rgba(255,255,255,0.55);
        padding: 20px 22px;
        margin-bottom: 22px;
      }

      /* ---------- 总结 ---------- */
      .summary-card p {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }

      /* ---------- 扫描计数 ---------- */
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 22px;
      }
      .stat {
        background: var(--bg);
        border-radius: 16px;
        box-shadow: 5px 5px 12px var(--shadow-dark), -5px -5px 12px var(--shadow-light),
          inset 0 0 0 1px rgba(255,255,255,0.55);
        padding: 14px 10px 12px;
        text-align: center;
      }
      .stat .num {
        display: block;
        font-size: 26px;
        font-weight: 800;
        color: var(--accent);
        line-height: 1.2;
      }
      .stat .label {
        display: block;
        font-size: 13px;
        color: var(--ink-soft);
        margin-top: 2px;
      }

      /* ---------- ETF 块 ---------- */
      .section-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--ink-soft);
        margin: 0 0 12px;
      }
      .etf-head {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 6px 12px;
        padding-bottom: 14px;
        border-bottom: 1px solid #E4DED0;
      }
      .ticker {
        font-size: 30px;
        font-weight: 800;
        color: var(--accent);
        letter-spacing: 0.02em;
        line-height: 1.1;
      }
      .etf-name {
        font-size: 16px;
        font-weight: 600;
      }
      .exchange {
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-soft);
        background: var(--chip-bg);
        border-radius: 6px;
        padding: 2px 8px;
      }
      .rec-count {
        margin-left: auto;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink);
        background: #F3E3A1;
        border-radius: 999px;
        padding: 4px 12px;
        white-space: nowrap;
      }
      .in-list-tag {
        font-size: 13px;
        font-weight: 700;
        color: var(--accent);
        background: var(--bg);
        border-radius: 999px;
        padding: 4px 12px;
        box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        white-space: nowrap;
      }

      .mention { padding: 16px 0 4px; }
      .mention + .mention {
        border-top: 1px dashed #E0D9C8;
        margin-top: 8px;
      }
      .blogger-line { margin: 0 0 6px; font-size: 16px; }
      .blogger-line strong { font-weight: 800; }
      .video-title { margin: 0 0 6px; font-size: 15px; }
      .video-title a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
        border-bottom: 1px solid rgba(156, 47, 31, 0.35);
        padding-bottom: 1px;
      }
      .video-title a:hover, .video-title a:focus { border-bottom-color: var(--accent); }
      .meta-line {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--ink-faint);
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
      }
      .basis-tag {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-soft);
        background: var(--chip-bg);
        border-radius: 6px;
        padding: 1px 8px;
      }
      .reason { margin: 0; font-size: 15px; color: var(--ink); }
      .reason .reason-label { color: var(--ink-soft); font-weight: 600; }

      /* ---------- 近失 ---------- */
      .nearmiss-list { list-style: none; margin: 0; padding: 0; }
      .nearmiss-list li { padding: 12px 0; }
      .nearmiss-list li + li { border-top: 1px dashed #E0D9C8; }
      .nearmiss-list li:first-child { padding-top: 2px; }
      .nearmiss-list li:last-child { padding-bottom: 0; }
      .nm-channel { font-weight: 700; font-size: 15px; }
      .nm-title { font-size: 15px; }
      .nm-title a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
        border-bottom: 1px solid rgba(156, 47, 31, 0.35);
      }
      .nm-title a:hover, .nm-title a:focus { border-bottom-color: var(--accent); }
      .nm-date { font-size: 13px; color: var(--ink-faint); }
      .nm-note { margin: 4px 0 0; font-size: 14px; color: var(--ink-soft); }

      /* ---------- 页脚 ---------- */
      footer {
        font-size: 13px;
        color: var(--ink-faint);
        line-height: 1.7;
        padding: 2px 4px 0;
      }
      footer p { margin: 0 0 6px; }
      footer p:last-child { margin-bottom: 0; }

      .empty-note { font-size: 15px; color: var(--ink-soft); margin: 0; }

      @media (max-width: 480px) {
        .wrap { padding: 22px 14px 32px; }
        h1 { font-size: 23px; }
        .card { padding: 17px 16px; border-radius: 18px; }
        .ticker { font-size: 26px; }
        .rec-count { margin-left: 0; }
        .stat .num { font-size: 23px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"></div>

    <script>
      // 构建时嵌入的数据（与 data.json 同一份）；fetch 失败时用它渲染。
      var EMBEDDED = {
        "editions": [
          {
            "weekStart": "2026-11-02",
            "weekEnd": "2026-11-09",
            "status": "ready",
            "summary": "本周共1只ETF获得推荐，被推荐次数最多的是CLSA，获推荐1次。",
            "channelsScanned": 6,
            "scannedVideos": 5,
            "includedVideos": 1,
            "etfs": [
              {
                "ticker": "CLSA",
                "name": "Brompton Split Corp. Enhanced Equity Income ETF",
                "exchange": "TSX",
                "inUserList": false,
                "mentions": [
                  {
                    "channel": "Passive Income Investing",
                    "videoTitle": "CLSA 15% Yield Income ETF: My 5k/Month BUY Strategy Explained for Amazing Total Returns",
                    "videoUrl": "https://www.youtube.com/watch?v=4KQZuOm2VM4",
                    "publishedAt": "2026-11-08",
                    "basis": "据视频内容",
                    "reason": "博主称这是他新近最喜欢的ETF之一：它一站式持有多只分拆股基金、底层多为加拿大金融等蓝筹股，总回报突出；他计划在条件满足时每月买入约5000加元。"
                  }
                ]
              }
            ],
            "nearMisses": [
              {
                "channel": "WealthAwesome",
                "videoTitle": "VGRO vs XGRO",
                "videoUrl": "https://www.youtube.com/watch?v=H9f589I4s2g",
                "publishedAt": "2026-11-02",
                "note": "二选一比较，作者称两只没有通用赢家——是比较，不是推荐。"
              },
              {
                "channel": "Maple Paisa",
                "videoTitle": "Why the TSX Held Up When the Nasdaq Crashed",
                "videoUrl": "https://www.youtube.com/watch?v=_DT7uU2KWyo",
                "publishedAt": "2026-11-07",
                "note": "讲解 XEQT/VEQT 的成分与分散作用，作者自述不是买卖推荐。"
              }
            ],
            "note": "种子期最初经网页搜索发现、索引不全，小频道与中文博主的视频可能漏检；本期已用 YouTube 站内关键词（含中文）补跑。"
          }
        ]
      };

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderMention(m) {
        var html = '<div class="mention">';
        html += '<p class="blogger-line"><strong>推荐博主：' + esc(m.channel) + '</strong></p>';
        html += '<p class="video-title"><a href="' + esc(m.videoUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(m.videoTitle) + '</a></p>';
        html += '<p class="meta-line"><span>发布于 ' + esc(m.publishedAt) + '</span>';
        if (m.basis) html += '<span class="basis-tag">' + esc(m.basis) + '</span>';
        html += '</p>';
        html += '<p class="reason"><span class="reason-label">推荐缘由：</span>' + esc(m.reason) + '</p>';
        html += '</div>';
        return html;
      }

      function renderEtf(e) {
        var n = (e.mentions || []).length;
        var html = '<section class="card">';
        html += '<div class="etf-head">';
        html += '<span class="ticker">' + esc(e.ticker) + '</span>';
        html += '<span class="etf-name">' + esc(e.name) + '</span>';
        html += '<span class="exchange">' + esc(e.exchange) + '</span>';
        if (e.inUserList) html += '<span class="in-list-tag">在你的清单内</span>';
        html += '<span class="rec-count">' + n + ' 位博主推荐</span>';
        html += '</div>';
        (e.mentions || []).forEach(function (m) { html += renderMention(m); });
        html += '</section>';
        return html;
      }

      function renderNearMiss(nm) {
        var html = '<li>';
        html += '<span class="nm-channel">' + esc(nm.channel) + '</span> · ';
        html += '<span class="nm-title"><a href="' + esc(nm.videoUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(nm.videoTitle) + '</a></span> ';
        html += '<span class="nm-date">' + esc(nm.publishedAt) + '</span>';
        if (nm.note) html += '<p class="nm-note">' + esc(nm.note) + '</p>';
        html += '</li>';
        return html;
      }

      function render(data) {
        var ed = data && data.editions && data.editions[0];
        var app = document.getElementById("app");
        if (!ed) {
          app.innerHTML = '<div class="card"><p class="empty-note">暂无本期数据。</p></div>';
          return;
        }
        var html = '';

        // 页眉
        html += '<header>';
        html += '<div class="title-row"><h1>加拿大 ETF 每周扫描</h1><span class="snapshot-badge">快照版</span></div>';
        html += '<p class="week-line">本期周次：<strong>' + esc(ed.weekStart) + ' – ' + esc(ed.weekEnd) + '</strong></p>';
        html += '</header>';

        // 一句话总结
        html += '<section class="card summary-card"><p>' + esc(ed.summary) + '</p></section>';

        // 扫描计数
        html += '<div class="stats">';
        html += '<div class="stat"><span class="num">' + esc(ed.channelsScanned) + '</span><span class="label">扫描频道</span></div>';
        html += '<div class="stat"><span class="num">' + esc(ed.scannedVideos) + '</span><span class="label">扫描视频</span></div>';
        html += '<div class="stat"><span class="num">' + esc(ed.includedVideos) + '</span><span class="label">收录视频</span></div>';
        html += '</div>';

        // 正文：按 ETF 组织
        html += '<h2 class="section-title">本期获推荐的 ETF</h2>';
        if (ed.etfs && ed.etfs.length) {
          ed.etfs.forEach(function (e) { html += renderEtf(e); });
        } else {
          html += '<section class="card"><p class="empty-note">未发现符合收录标准的明确推荐。</p></section>';
        }

        // 未入选（近失）
        if (ed.nearMisses && ed.nearMisses.length) {
          html += '<h2 class="section-title">未入选（近失）</h2>';
          html += '<section class="card"><ul class="nearmiss-list">';
          ed.nearMisses.forEach(function (nm) { html += renderNearMiss(nm); });
          html += '</ul></section>';
        }

        // 页脚
        html += '<footer>';
        html += '<p>以上均为对博主观点的转述，不代表推荐或背书。</p>';
        if (ed.note) html += '<p>' + esc(ed.note) + '</p>';
        html += '</footer>';

        app.innerHTML = html;
      }

      // 先用嵌入数据渲染，再尝试 fetch 同目录 data.json；成功则用同一渲染函数重渲染。
      render(EMBEDDED);
      if (window.fetch) {
        fetch("./data.json", { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("no data.json");
            return res.json();
          })
          .then(function (data) {
            if (data && data.editions && data.editions.length) render(data);
          })
          .catch(function () { /* 保持嵌入数据渲染 */ });
      }
    </script>
  </body>
</html>
